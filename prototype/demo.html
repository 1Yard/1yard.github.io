<style>
/* Layout: sticky top bar with role switcher; one centered column per role. Client view uses larger type and big tap targets. */
:root {
  --bg: #F5F9EC;
  --surface: #FFFFFF;
  --tint: #E8F3D2;
  --tint-2: #C1E479;
  --accent: #577518;
  --accent-strong: #3A4E10;
  --accent-ink: #FFFFFF;
  --fg: #1D2708;
  --muted: #5C6B45;
  --line: #DCE7C4;
  --amber-bg: #FFF1D1; --amber-fg: #835600;
  --rose-bg: #FBE2E0; --rose-fg: #962F27;
  --sky-bg: #E0ECF8; --sky-fg: #25537F;
  --green-bg: #DDF0BC; --green-fg: #3A5A0C;
  --grey-bg: #ECEEE7; --grey-fg: #5B6152;
  --shadow: 0 1px 2px rgba(40,60,10,.06), 0 4px 14px rgba(40,60,10,.05);
  --display: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12170A; --surface: #1A2110; --tint: #243014; --tint-2: #3A4D1A; --accent: #B5DA6A; --accent-strong: #CBE893; --accent-ink: #12170A;
  --fg: #EAF2DA; --muted: #A6B58B; --line: #2E3A1D;
  --amber-bg: #3A2D10; --amber-fg: #F3C76E; --rose-bg: #3B1C19; --rose-fg: #F2A39B; --sky-bg: #192A3B; --sky-fg: #9CC6EE;
  --green-bg: #2A3D12; --green-fg: #C4E68A; --grey-bg: #262B1F; --grey-fg: #B3B9A6; --shadow: 0 1px 2px rgba(0,0,0,.35); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #12170A; --surface: #1A2110; --tint: #243014; --tint-2: #3A4D1A; --accent: #B5DA6A; --accent-strong: #CBE893; --accent-ink: #12170A;
  --fg: #EAF2DA; --muted: #A6B58B; --line: #2E3A1D;
  --amber-bg: #3A2D10; --amber-fg: #F3C76E; --rose-bg: #3B1C19; --rose-fg: #F2A39B; --sky-bg: #192A3B; --sky-fg: #9CC6EE;
  --green-bg: #2A3D12; --green-fg: #C4E68A; --grey-bg: #262B1F; --grey-fg: #B3B9A6; --shadow: 0 1px 2px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15.5px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; line-height: 1.15; } h2 { font-size: 1.35rem; } h3 { font-size: 1.1rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-inner { max-width: 1000px; margin: 0 auto; padding-block: 10px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 1.5rem; color: var(--accent); }
.brand svg { width: 38px; height: 30px; }
.brand small { font-family: var(--body); font-weight: 600; font-size: .72rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-left: 6px; }
.roles { display: flex; gap: 4px; background: var(--tint); padding: 4px; border-radius: 999px; }
.roles button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); }
.roles button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.season { background: var(--accent); color: var(--accent-ink); text-align: center; font-weight: 600; font-size: .85rem; padding: 5px 16px; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 22px; }
.wrap.narrow { max-width: 680px; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.head p { color: var(--muted); margin-top: 4px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.label { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.btn { border: 1.5px solid transparent; background: var(--accent); color: var(--accent-ink); padding: 8px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover:not(:disabled) { background: var(--tint); }
.btn.danger { background: transparent; color: var(--rose-fg); border-color: var(--line); }
.btn.danger:hover { background: var(--rose-bg); }
.btn.locked { background: var(--grey-bg); color: var(--grey-fg); opacity: 1; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.c-amber { background: var(--amber-bg); color: var(--amber-fg); }
.c-rose { background: var(--rose-bg); color: var(--rose-fg); }
.c-sky { background: var(--sky-bg); color: var(--sky-fg); }
.c-green { background: var(--green-bg); color: var(--green-fg); }
.c-grey { background: var(--grey-bg); color: var(--grey-fg); }
.tag { font-size: .8rem; padding: 2px 9px; border-radius: 6px; background: var(--tint); }
.tag.have { background: var(--green-bg); color: var(--green-fg); font-weight: 600; }
.tag.warn { background: var(--amber-bg); color: var(--amber-fg); font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.stat { background: var(--tint); border-radius: 12px; padding: 12px 16px; }
.stat b { display: block; font-family: var(--display); font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .84rem; color: var(--muted); }
.stat.alert { background: var(--amber-bg); }
.stat.alert span, .stat.alert b { color: var(--amber-fg); }

.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 2px; margin-right: 18px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2.5px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--amber-bg); color: var(--amber-fg); font-size: .75rem; text-align: center; }

.list { display: grid; gap: 12px; }
.split { display: grid; grid-template-columns: minmax(0,1fr) 230px; gap: 18px; align-items: start; }
.quote { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: .92rem; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px; font-size: .9rem; }
.kv div span { display: block; color: var(--muted); font-size: .75rem; }
.side { display: grid; gap: 10px; background: var(--tint); border-radius: 12px; padding: 14px; }
.side label { display: grid; gap: 4px; font-size: .82rem; font-weight: 600; color: var(--muted); }
.side input, .side select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); width: 100%; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; }

.steps { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; list-style: none; padding: 0; margin: 0; }
.steps li { padding: 9px 11px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: .82rem; color: var(--muted); }
.steps li b { display: block; font-size: .92rem; color: var(--fg); }
.steps li.done { background: var(--tint); border-color: var(--tint-2); }
.steps li.done b::after { content: " ✓"; color: var(--accent); }
.steps li.now { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.banner { background: var(--tint); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
.banner select { padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); max-width: 100%; }
.note { border-left: 4px solid var(--accent); background: var(--surface); padding: 12px 14px; border-radius: 0 12px 12px 0; }

form .field, .field { display: grid; gap: 6px; }
.lbl { font-weight: 600; font-size: .92rem; }
input[type=text], input[type=email], input[type=tel], textarea, select.in { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); }
textarea { min-height: 90px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.check { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: .92rem; background: var(--surface); }
.check:has(input:checked) { background: var(--tint); border-color: var(--tint-2); }

.module { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
.module .ico { width: 38px; height: 38px; border-radius: 10px; background: var(--tint); display: grid; place-items: center; font-weight: 700; color: var(--accent); font-size: .85rem; }
.drop { border: 1.5px dashed var(--tint-2); border-radius: 12px; padding: 14px; background: var(--bg); display: grid; gap: 8px; }
.lock { text-align: center; padding: 30px 20px; background: var(--tint); border-radius: 14px; display: grid; gap: 6px; justify-items: center; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: .86rem; }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.jobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.job { display: grid; gap: 10px; align-content: start; }
.job.priority { border-color: var(--amber-fg); }
.job .when { font-weight: 700; font-family: var(--display); font-size: 1.05rem; }
.job dl { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 6px 12px; margin: 0; font-size: .88rem; }
.job dt { color: var(--muted); }
.job dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.slot { border-radius: 10px; padding: 7px 10px; font-size: .82rem; line-height: 1.3; border: 1.5px solid var(--line); min-width: 0; }
.slot b { display: block; font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot.exp { background: var(--green-bg); border-color: transparent; color: var(--green-fg); }
.slot.trainee { background: var(--sky-bg); border-color: transparent; color: var(--sky-fg); }
.slot.empty { border-style: dashed; color: var(--muted); }
.slot.exp-only { border-style: dashed; border-color: var(--amber-fg); color: var(--amber-fg); }
.job .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
.confirm { background: var(--rose-bg); color: var(--rose-fg); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }

/* ---- client UI: big, plain, one question per screen ---- */
.client { font-size: 19px; line-height: 1.55; }
.client h1 { font-size: 2.1rem; }
.client h2 { font-size: 1.7rem; }
.client .muted { color: var(--fg); opacity: .78; }
.bigbtn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; width: 100%; padding: 14px 22px; font-size: 1.2rem; font-weight: 700; border-radius: 14px; border: 2px solid transparent; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.bigbtn.ghost { background: var(--surface); color: var(--fg); border-color: var(--line); }
.bigbtn:disabled { opacity: .45; cursor: not-allowed; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.tile { display: flex; align-items: center; gap: 14px; text-align: left; min-height: 76px; padding: 14px 16px; border: 2.5px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; font-size: 1.08rem; font-weight: 600; }
.tile .em { font-size: 1.8rem; line-height: 1; }
.tile small { display: block; font-weight: 400; font-size: .88rem; color: var(--muted); }
.tile[aria-pressed="true"] { border-color: var(--accent); background: var(--tint); box-shadow: inset 0 0 0 1.5px var(--accent); }
.tile[aria-pressed="true"]::after { content: "✓"; margin-left: auto; font-size: 1.4rem; color: var(--accent); font-weight: 700; }
.client input[type=text], .client input[type=email], .client input[type=tel], .client textarea { font-size: 1.1rem; padding: 14px 16px; border-width: 2px; border-radius: 12px; }
.client .lbl { font-size: 1.05rem; }
.wiz-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.bar { height: 10px; border-radius: 99px; background: var(--tint); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.wiz-nav { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
.err { color: var(--rose-fg); background: var(--rose-bg); padding: 10px 14px; border-radius: 10px; font-weight: 600; }
.toolrow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); }
.yn { display: flex; gap: 8px; }
.yn button { min-width: 84px; min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-size: 1.05rem; cursor: pointer; }
.yn button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.summary { display: grid; gap: 0; }
.summary > div { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.summary span { display: block; font-size: .85rem; color: var(--muted); font-weight: 600; }
.linkbtn { background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-weight: 600; font-size: 1rem; padding: 4px; }
.timeline { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.timeline div { text-align: center; font-size: .82rem; font-weight: 600; color: var(--muted); }
.timeline div i { display: block; height: 8px; border-radius: 99px; background: var(--tint); margin-bottom: 6px; }
.timeline div.on { color: var(--fg); }
.timeline div.on i { background: var(--accent); }
.thanks { background: var(--green-bg); color: var(--green-fg); border-radius: 16px; padding: 20px; display: grid; gap: 6px; }
.agree { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; background: var(--surface); }
.agree input { width: 26px; height: 26px; flex: none; margin-top: 2px; accent-color: var(--accent); }

.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.dayc { border: 2.5px solid var(--line); border-radius: 14px; background: var(--surface); }
.dayc.on { border-color: var(--accent); background: var(--tint); }
.dbtn { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: 0; padding: 14px 16px; font-size: 1.08rem; font-weight: 700; text-align: left; cursor: pointer; min-height: 60px; }
.dbtn:disabled { opacity: .4; cursor: not-allowed; }
.dayc.on .dbtn::after { content: "✓"; color: var(--accent); font-size: 1.3rem; }
.parts { display: flex; gap: 6px; padding: 0 12px 12px; }
.parts button { flex: 1; min-height: 52px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; font-size: .95rem; line-height: 1.2; }
.parts button small { display: block; font-weight: 400; font-size: .78rem; }
.parts button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.wins { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: .9rem; }
.wins li::before { content: "• "; color: var(--accent); font-weight: 700; }
.picker { background: var(--tint); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.picker select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); width: 100%; }
.alertline { background: var(--amber-bg); color: var(--amber-fg); border-radius: 10px; padding: 8px 12px; font-size: .88rem; font-weight: 600; }
.call { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 14px; align-items: start; }
.call .phone { font-family: var(--display); font-size: 1.3rem; font-weight: 700; }
.winrows { display: grid; gap: 6px; }
.winrows .row { flex-wrap: nowrap; }
.winrows input, .winrows select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-weight: 500; transition: .2s; pointer-events: none; max-width: calc(100% - 32px); z-index: 10; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
footer { text-align: center; }
footer button { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: .85rem; }

@media (max-width: 720px) {
  .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .steps { grid-template-columns: repeat(2, minmax(0,1fr)); }

}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<script>
/* ============ CONFIG (becomes lookup tables in Supabase) ============ */
const SEASON = { id: "fall-2026", label: "Fall 2026 services are open" };
// Swap this list (and SEASON) for winter: snow shovelling, salting walkways, etc.
const SERVICES = [
  { id: "leaves",  name: "Raking leaves",              em: "🍂", hint: "Rake and bag fallen leaves",       skills: ["raking"],  tools: ["rake", "bags"] },
  { id: "mow",     name: "Last lawn mow",              em: "🌱", hint: "One final cut before winter",      skills: ["mower"],   tools: ["mower"] },

// ----- scheduling -----
// A job starts with the client's 2-4 date options ("windows"). The first volunteer locks in an exact
// date + start time inside one window; the second volunteer joins at that time.
const today = () => day(0);
const fmtTime = (t) => { const [h, m] = t.split(":").map(Number); return ((h + 11) % 12 + 1) + (m ? ":" + String(m).padStart(2, "0") : "") + (h < 12 ? "am" : "pm"); };
const liveWindows = (j) => (j.windows || []).filter((x) => x.date > today()).sort((a, b) => a.date.localeCompare(b.date));
const windowText = (x) => `${fmtDate(x.date)} · ${PARTS[x.part].name.toLowerCase()} (${PARTS[x.part].range})`;
const isLocked = (j) => !!j.date && !!j.start && crew(j.id).length > 0;
const whenText = (j, long) => `${fmtDate(j.date, long)} at ${fmtTime(j.start)}`;
const needsNewDates = (j) => j.status === "scheduled" && !isFull(j) && (isLocked(j) ? j.date <= today() : liveWindows(j).length === 0);
const sortKey = (j) => (isLocked(j) ? j.date + j.start.padStart(5, "0") : liveWindows(j)[0]?.date || j.date || j.windows?.[0]?.date || "");
function startTimes(part, hours) {
  const p = PARTS[part], out = [], last = Math.max(p.from * 60, p.to * 60 - hours * 60);
  for (let t = p.from * 60; t <= last; t += 30) out.push(`${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`);
  return out;
}
// Every possible "date|start" a volunteer can pick, grouped by the client's windows.
const timeChoices = (j, cur) => liveWindows(j).map((x) => `<optgroup label="${windowText(x)}">${startTimes(x.part, j.hours).map((t) => `<option value="${x.date}|${t}" ${cur === x.date + "|" + t ? "selected" : ""}>${fmtDate(x.date)} · ${fmtTime(t)}</option>`).join("")}</optgroup>`).join("");
// Admin call list: tell clients their crew is set, and get new dates when none worked out.
const callItems = () => S.jobs.filter((j) => j.status === "scheduled").flatMap((j) => isFull(j) && !j.toldAt ? [{ j, kind: "tell" }] : needsNewDates(j) ? [{ j, kind: "dates" }] : []);
function windowRows(prefix, wins) {
  return `<div class="winrows">${[0, 1, 2, 3].map((i) => { const x = wins[i] || {}; return `<div class="row"><input type="date" id="${prefix}-date-${i}" value="${x.date || ""}" aria-label="Date option ${i + 1}"><select id="${prefix}-part-${i}" aria-label="Time of day ${i + 1}">${Object.entries(PARTS).map(([k, p]) => `<option value="${k}" ${k === (x.part || "any") ? "selected" : ""}>${p.name} (${p.range})</option>`).join("")}</select></div>`; }).join("")}</div>`;
}
function readWindows(prefix) {
  const out = [];
  for (let i = 0; i < 4; i++) { const date = $(`#${prefix}-date-${i}`)?.value; if (date && !out.some((x) => x.date === date)) out.push({ date, part: $(`#${prefix}-part-${i}`).value }); }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

// Trainee shadow shifts = completed jobs where they went as a trainee alongside an experienced volunteer.
function shadowCount(vid) {
  return S.signups.filter((s) => s.vid === vid && s.asTrainee && job(s.jobId)?.status === "done" &&
    S.signups.some((p) => p.jobId === s.jobId && p.vid !== vid && !p.asTrainee)).length;
}
const jobsDone = (vid) => S.signups.filter((s) => s.vid === vid && job(s.jobId)?.status === "done").length;

// THE matching rule. Every job has 2 spots; a job can never have two trainees.
function canJoin(v, j) {
  const c = crew(j.id);
  if (!canSeeBoard(v)) return { ok: false, why: "Finish training first" };
  if (j.status !== "scheduled") return { ok: false, why: "Not open" };
  if (c.some((s) => s.vid === v.id)) return { ok: false, why: "You're on this job" };
  if (c.length >= 2) return { ok: false, why: "Full" };
  if (needsNewDates(j)) return { ok: false, why: "Waiting on new dates" };
  if (v.status === "trainee" && c.some((s) => s.asTrainee)) return { ok: false, why: "Experienced volunteers only" };
  return { ok: true };
}

const V_STATUS = { pending: ["Waiting for review", "c-amber"], approved: ["Approved · doing training", "c-sky"], trainee: ["Trainee", "c-sky"], experienced: ["Experienced", "c-green"], declined: ["Declined", "c-rose"] };

  if (j.status === "review") return ["New request", "c-amber"];
  if (j.status === "declined") return ["Declined", "c-rose"];
  if (j.status === "cancelled") return ["Cancelled", "c-grey"];

  if (n >= 2) return j.toldAt ? ["Crew confirmed · client told", "c-green"] : ["Crew confirmed · call client", "c-amber"];
  if (needsExperienced(j)) return ["Needs experienced volunteer", "c-amber"];
  return [n === 0 ? "Needs 2 volunteers" : "Needs 1 volunteer", "c-sky"];
}

function volunteerView() {
  const v = S.vid === "new" ? null : vol(S.vid);
  const persona = `<div class="banner">
    <div class="row"><label for="persona-v" class="label">Viewing as</label>
      <select id="persona-v"><option value="new" ${!v ? "selected" : ""}>+ New applicant (sign up)</option>${S.volunteers.map((x) => `<option value="${x.id}" ${x.id === S.vid ? "selected" : ""}>${esc(x.name)} · ${V_STATUS[x.status][0]}</option>`).join("")}</select></div>
    <span class="muted small">Demo only: switch between volunteers at different stages.</span>
  </div>`;
  if (!v) return persona + signupView();

  const sc = shadowCount(v.id);
  const [doneCount, now] = { pending: [1, 1], declined: [1, -1], approved: [2, 2], trainee: [3, 3], experienced: [5, -1] }[v.status];
  const steps = [["Apply", "Send your application"], ["Approval", "An admin reviews it"], ["Online training", "Modules and waiver"],
    ["Shadow shifts", v.status === "trainee" ? `${sc} of ${SHADOW_SHIFTS_NEEDED} done` : `${SHADOW_SHIFTS_NEEDED} jobs with an experienced volunteer`], ["Experienced", "Can lead new volunteers"]];
  const stepper = `<ol class="steps">${steps.map(([b, s], i) => `<li class="${i < doneCount ? "done" : ""} ${i === now ? "now" : ""}"><b>${b}</b>${s}</li>`).join("")}</ol>`;

  let body = "";
  if (v.status === "pending") body = `<div class="card stack"><h2>Thanks, ${esc(first(v.name))}. Your application is in.</h2>
    <p class="muted">An admin will review it soon. Once you're approved, your training and waiver will show up here.</p>
    <p class="small muted">Demo tip: switch to <b>Admin</b> to approve this application.</p></div>` + lockedBoard();
  else if (v.status === "declined") body = `<div class="card stack"><h2>Application not approved</h2>
    <p class="muted">Thanks for your interest in 1Yard. Your application wasn't approved this season. Contact the team if you have questions.</p></div>`;
  else if (v.status === "approved") body = trainingView() + lockedBoard();
  else body = boardView(v, sc);

  return persona + `<div class="head"><div><h1>Hi, ${esc(first(v.name))}</h1><p>${esc(v.uni)} · ${v.skills.map((s) => SKILLS[s]).join(", ")}</p></div>${vChip(v.status)}</div>` + stepper + body;
}

function boardView(v, sc) {
  const mine = S.signups.filter((s) => s.vid === v.id).map((s) => job(s.jobId)).filter((j) => j.status === "scheduled").sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
  let open = S.jobs.filter((j) => j.status === "scheduled" && !isFull(j) && !needsNewDates(j) && !crew(j.id).some((s) => s.vid === v.id));
  if (S.boardFilter === "skills") open = open.filter((j) => neededSkills(j.services).every((k) => v.skills.includes(k)));
  if (S.boardFilter === "exp") open = open.filter(needsExperienced);
  const rank = (j) => v.status === "experienced" ? (needsExperienced(j) ? 0 : 1) : (canJoin(v, j).ok ? 0 : 1);
  open.sort((a, b) => rank(a) - rank(b) || sortKey(a).localeCompare(sortKey(b)));
  const filters = [["all", "All open jobs"], ["skills", "Fits my skills"], ...(v.status === "experienced" ? [["exp", "Trainee needs a partner"]] : [])];
  const intro = v.status === "trainee"
    ? `<div class="note"><b>You're a trainee: ${sc} of ${SHADOW_SHIFTS_NEEDED} shadow shifts done.</b> You can take a job that's empty or that already has an experienced volunteer. Once you sign up for an empty job, only an experienced volunteer can take the second spot.</div>`
    : `<div class="note"><b>You're an experienced volunteer.</b> Jobs where a trainee is waiting for a partner are shown first. Trainees can't go without you.</div>`;
  return `${intro}
  <section class="stack">
    <div class="head"><div><h2>My upcoming jobs</h2><p>Full address and client contact show here once you've signed up.</p></div></div>
    ${mine.length ? `<div class="jobs">${mine.map((j) => myJobCard(j, v)).join("")}</div>` : `<div class="empty">You haven't signed up for anything yet. Pick a job below.</div>`}

}

  return `<dl>
    <dt>Where</dt><dd>${full ? `<b>${esc(c.address)}, ${esc(c.postal)}</b>` : `${esc(c.area)} <span class="muted">(full address after you sign up)</span>`}</dd>
    ${full ? `<dt>Client</dt><dd>${esc(c.name)} · ${esc(c.phone)}</dd>` : ""}
    <dt>Skills</dt><dd>${skills.length ? skills.map((k) => `<span class="tag ${v.skills.includes(k) ? "have" : ""}">${v.skills.includes(k) ? "✓ " : ""}${SKILLS[k]}</span>`).join("") : `<span class="muted">No special skills</span>`}</dd>
    <dt>Tools</dt><dd>${have.map((t) => `<span class="tag">${TOOLS[t].name}</span>`).join("")}${miss.map((t) => `<span class="tag warn">No ${TOOLS[t].name.toLowerCase()}</span>`).join("")}<span class="tag">Bring: gloves</span></dd>
    ${j.flags.length ? `<dt>Heads up</dt><dd>${j.flags.map((f) => `<span class="tag">${FLAGS[f].em} ${FLAGS[f].name}</span>`).join("")}</dd>` : ""}
    ${j.notes && full ? `<dt>Note</dt><dd>${esc(j.notes)}</dd>` : ""}
  </dl>`;
}
function picker(j, cur, verb) {
  return `<div class="picker">
    <label class="lbl" for="pk-${j.id}">Pick a start time (job takes about ${j.hours}h)</label>

}
function openJobCard(j, v) {

    ${slots(j)}

function myJobCard(j, v) {
  const c = crew(j.id), partner = c.find((s) => s.vid !== v.id), full = c.length >= 2, pv = partner && vol(partner.vid);
  const confirming = S.confirm === "leave:" + j.id;

  if (confirming) foot = `<div class="confirm"><b>Leave this job?</b>${partner && !c.find((s) => s.vid === v.id).asTrainee && partner.asTrainee ? " Your trainee partner will need a new experienced volunteer." : ""}${!partner ? " The client's days will open up again for others." : ""}<div class="row"><button class="btn danger" data-act="leaveYes" data-id="${j.id}">Yes, leave</button><button class="btn ghost" data-act="confirmNo">Keep it</button></div></div>`;
  else if (S.picking === j.id) foot = picker(j, j.date + "|" + j.start, "Save new time");
  else foot = `<div class="foot">${full ? `<button class="btn" data-act="done" data-id="${j.id}">We finished this job</button>` : `<button class="btn ghost" data-act="pickOpen" data-id="${j.id}">Change time</button>`}<button class="btn danger" data-act="leave" data-id="${j.id}">Leave job</button></div>`;
  return `<article class="card job">
    <div class="row" style="justify-content:space-between"><span class="when">${whenText(j)}</span><span class="small muted">~${j.hours}h</span></div>
    ${j.timeChangedAt ? `<div class="alertline">⚠ An admin changed the time ${ago(j.timeChangedAt)}. It's now ${whenText(j)}.</div>` : ""}
    <h3>${esc(jobTitle(j))}</h3>
    ${jobFacts(j, v, true)}
    ${slots(j)}
    ${pv ? `<div class="picker" style="gap:2px"><span class="label">Your partner</span><b>${esc(pv.name)}</b><span class="small">📞 ${esc(pv.phone)} · ✉️ ${esc(pv.email)}</span><span class="small muted">Running late or can't make it? Text your partner and let the 1Yard admin know.</span></div>`
      : `<p class="small">${needsExperienced(j) ? "Waiting for an experienced volunteer to join you." : "Waiting for a second volunteer."} You can change the time until someone joins.</p>`}
    ${foot}

}

/* ---------------- CLIENT ---------------- */
function clientView() {
  const c = S.cid === "new" ? null : client(S.cid);
  const persona = `<div class="banner" style="font-size:.9rem">
    <div class="row"><label for="persona-c" class="label">Viewing as</label>
      <select id="persona-c"><option value="new" ${!c ? "selected" : ""}>+ New client</option>${S.clients.map((x) => `<option value="${x.id}" ${x.id === S.cid ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>
    <span class="muted small">Demo only.</span>
  </div>`;
  if (S.wiz) return persona + wizardView();
  if (!c) return persona + `
    <div class="stack" style="gap:18px">
      <h1>Need help with your yard?</h1>
      <p>1Yard volunteers help seniors and people with physical limitations with outdoor yard work. It's free.</p>
      <div class="card stack">
        <p>🍂 Raking leaves, garden clean-up, last lawn mow, and picking up branches.</p>
        <p>🧤 Two volunteers come together. They bring gloves and use your tools.</p>
        <p>🏡 We only work outside. We never need to come into your home.</p>
      </div>
      <button class="bigbtn" data-act="wizStart">Ask for help</button>
      <p class="muted" style="text-align:center">Prefer to talk? Call us at <b>${OFFICE_PHONE}</b></p>
    </div>`;

  const mine = S.jobs.filter((j) => j.clientId === c.id).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const active = activeJob(c.id);
  return persona + `
    ${S.justSent ? `<div class="thanks"><h2>Thank you, ${esc(first(c.name))}!</h2><p>We got your request. Someone from 1Yard will ${c.contact === "email" ? "email" : "call"} you soon to check the details.</p></div>` : ""}
    <div class="stack" style="gap:18px">
      <h1>Hello, ${esc(first(c.name))}</h1>
      ${active ? `<div class="note">You can have <b>one request at a time</b>. When this one is done, you can ask for more help here.</div>` : `<button class="bigbtn" data-act="wizStart">Ask for more help</button>`}
      <h2 style="margin-top:8px">Your requests</h2>
      ${mine.length ? mine.map(clientJobCard).join("") : `<div class="empty">You haven't asked for help yet.</div>`}
      <p class="muted" style="text-align:center">Questions? Call us at <b>${OFFICE_PHONE}</b></p>
    </div>`;
}
function clientJobCard(j) {
  const c = crew(j.id), full = c.length >= 2;
  let step = 1, msg = "";
  if (j.status === "review") msg = "We got your request. We'll call you soon to check the details.";
  else if (j.status === "scheduled" && needsNewDates(j)) { step = 2; msg = "We couldn't find volunteers for your days. We'll call you to pick new ones."; }
  else if (j.status === "scheduled" && !full) { step = 2; msg = `We're finding 2 volunteers for one of your days:<ul class="wins" style="margin-top:6px;font-size:1rem">${liveWindows(j).map((x) => `<li>${fmtDate(x.date, true)}, ${PARTS[x.part].name.toLowerCase()}</li>`).join("")}</ul>`; }
  else if (j.status === "scheduled") { step = 3; msg = `<b>${c.map((s) => esc(first(vol(s.vid).name))).join(" and ")}</b> will come on <b>${whenText(j, true)}</b>.`; }
  else if (j.status === "done") { step = 4; msg = `All done on ${fmtDate(j.date, true)}. Thank you for letting us help!`; }
  else if (j.status === "declined") { step = 0; msg = "We can't help with this request right now. We'll call you to explain."; }
  else { step = 0; msg = "You cancelled this request."; }
  const active = j.status === "review" || j.status === "scheduled";
  const tools = neededTools(j.services).filter((t) => j.tools[t]);
  return `<article class="card stack">
    <h2 style="font-size:1.35rem">${j.services.map((s) => svc(s).em + " " + svc(s).name).join("<br>")}</h2>
    ${step ? `<div class="timeline">${["Request sent", "Finding volunteers", "Volunteers coming", "Done"].map((t, i) => `<div class="${i < step ? "on" : ""}"><i></i>${t}</div>`).join("")}</div>` : ""}
    <div>${msg}</div>
    ${step === 3 && tools.length ? `<p class="muted">Please leave these out for the volunteers: <b>${tools.map((t) => TOOLS[t].name.toLowerCase()).join(", ")}</b>.</p>` : ""}
    ${active ? (S.confirm === "ccancel:" + j.id
      ? `<div class="confirm"><b>Cancel this request?</b><div class="wiz-nav"><button class="bigbtn ghost" data-act="confirmNo">No, keep it</button><button class="bigbtn" style="background:var(--rose-fg);color:var(--surface)" data-act="ccancelYes" data-id="${j.id}">Yes, cancel</button></div></div>`
      : `<button class="bigbtn ghost" data-act="ccancel" data-id="${j.id}">Cancel this request</button>`) : ""}
  </article>`;
}

/* --- client request wizard: one question per screen --- */
const W_STEPS = ["services", "where", "when", "tools", "extra", "you", "review"];
function wizardView() {
  const w = S.wiz, d = w.d, step = W_STEPS[w.step], n = W_STEPS.length;
  const tile = (field, val, em, name, hint, multi) => {
    const on = multi ? d[field].includes(val) : d[field] === val;
    return `<button type="button" class="tile" data-act="pick" data-field="${field}" data-val="${val}" ${multi ? 'data-multi="1"' : ""} aria-pressed="${on}"><span class="em">${em}</span><span>${name}${hint ? `<small>${hint}</small>` : ""}</span></button>`;
  };
  let q = "";
  if (step === "services") q = `<h1>What do you need help with?</h1><p class="muted">Tap all that apply.</p>
    <div class="tiles">${SERVICES.map((s) => tile("services", s.id, s.em, s.name, s.hint, true)).join("")}</div>
    <p class="muted">We only do outdoor work. Volunteers won't come inside your home.</p>`;
  else if (step === "where") q = `<h1>Where is your yard?</h1>
    <div class="field"><label class="lbl" for="w-address">Street address</label><input type="text" id="w-address" data-w="address" value="${esc(d.address)}" placeholder="e.g. 12 Maple St" autocomplete="street-address"></div>
    <div class="field"><label class="lbl" for="w-postal">Postal code</label><input type="text" id="w-postal" data-w="postal" value="${esc(d.postal)}" placeholder="e.g. K7L 1A1" autocomplete="postal-code"></div>
    <div class="field"><label class="lbl" for="w-area">Neighbourhood <span class="muted">(if you know it)</span></label><input type="text" id="w-area" data-w="area" value="${esc(d.area)}" placeholder="e.g. Sydenham"></div>`;
  else if (step === "when") {
    const picked = d.windows, full = picked.length >= MAX_DAYS;
    const dayCard = (n) => { const date = day(n), x = picked.find((p) => p.date === date);
      return `<div class="dayc ${x ? "on" : ""}"><button type="button" class="dbtn" data-act="winDay" data-id="${date}" ${!x && full ? "disabled" : ""} aria-pressed="${!!x}">${fmtDate(date, true)}</button>
        ${x ? `<div class="parts">${Object.entries(PARTS).map(([k, p]) => `<button type="button" data-act="winPart" data-id="${date}|${k}" aria-pressed="${x.part === k}">${p.name}<small>${p.range}</small></button>`).join("")}</div>` : ""}</div>`; };
    const wk1 = picked.some((p) => p.date <= day(7)), wk2 = picked.some((p) => p.date > day(7));
    q = `<h1>Which days are good for you?</h1>
    <p>Tap <b>${MIN_DAYS} to ${MAX_DAYS} days</b>. Try to pick one from each week. Then tap morning, afternoon, or either.</p>
    <p class="lbl">${picked.length} of ${MAX_DAYS} days picked${picked.length >= MIN_DAYS ? " ✓" : ""}</p>
    <h2>In the next 7 days</h2><div class="days">${[1, 2, 3, 4, 5, 6, 7].map(dayCard).join("")}</div>
    <h2>The week after</h2><div class="days">${[8, 9, 10, 11, 12, 13, 14].map(dayCard).join("")}</div>
    ${picked.length && !(wk1 && wk2) ? `<p class="note">Tip: picking a day from each week helps us find volunteers faster.</p>` : ""}
    <p class="muted">Two volunteers will pick a start time on one of these days. We'll tell you the exact time.</p>`;
  }
  else if (step === "tools") { const tl = neededTools(d.services); q = `<h1>Do you have these tools?</h1>
    <p class="muted">Our volunteers bring gloves, but they use your tools. If you don't have something, that's okay. Just tell us.</p>
    <div class="list">${tl.map((t) => `<div class="toolrow"><span><span style="font-size:1.5rem">${TOOLS[t].em}</span> <b>${TOOLS[t].name}</b></span>
      <div class="yn"><button type="button" data-act="pick" data-field="tools.${t}" data-val="1" aria-pressed="${d.tools[t] === true}">Yes</button><button type="button" data-act="pick" data-field="tools.${t}" data-val="0" aria-pressed="${d.tools[t] === false}">No</button></div></div>`).join("")}</div>`; }
  else if (step === "extra") q = `<h1>Anything we should know?</h1><p class="muted">Tap any that are true. You can skip this.</p>
    <div class="tiles">${Object.entries(FLAGS).map(([k, x]) => tile("flags", k, x.em, x.name, "", true)).join("")}</div>
    <div class="field"><label class="lbl" for="w-notes">Anything else? <span class="muted">(optional)</span></label><textarea id="w-notes" data-w="notes" placeholder="e.g. Please leave the roses alone">${esc(d.notes)}</textarea></div>`;
  else if (step === "you") q = `<h1>How can we reach you?</h1>
    <div class="field"><label class="lbl" for="w-name">Your name</label><input type="text" id="w-name" data-w="name" value="${esc(d.name)}" autocomplete="name"></div>
    <div class="field"><label class="lbl" for="w-phone">Phone number</label><input type="tel" id="w-phone" data-w="phone" value="${esc(d.phone)}" autocomplete="tel"></div>
    <div class="field"><label class="lbl" for="w-email">Email <span class="muted">(optional)</span></label><input type="email" id="w-email" data-w="email" value="${esc(d.email)}" autocomplete="email"></div>
    <p class="lbl">How should we contact you?</p><div class="tiles">${Object.entries(CONTACT).map(([k, x]) => tile("contact", k, k === "phone" ? "📞" : k === "email" ? "✉️" : "👍", x, "")).join("")}</div>`;
  else {
    const rows = [
      ["What", d.services.map((s) => svc(s).name).join(", "), 0],
      ["Where", [d.address, d.postal].filter(Boolean).join(", "), 1],
      ["Days you're free", [...d.windows].sort((a, b) => a.date.localeCompare(b.date)).map((x) => `${fmtDate(x.date, true)}, ${PARTS[x.part].name.toLowerCase()}`).join("<br>"), 2],
      ["Your tools", neededTools(d.services).map((t) => `${TOOLS[t].name}: ${d.tools[t] ? "yes" : "no"}`).join("<br>"), 3],
      ["Good to know", [...d.flags.map((f) => FLAGS[f].name), d.notes].filter(Boolean).map(esc).join("<br>") || "Nothing", 4],
      ["You", `${esc(d.name)}<br>${esc(d.phone)}${d.email ? "<br>" + esc(d.email) : ""}`, 5],
    ];
    q = `<h1>Is this right?</h1>
    <div class="card summary">${rows.map(([k, v, i]) => `<div><div><span>${k}</span>${i === 1 || i === 0 ? esc(v) : v}</div><button class="linkbtn" data-act="wizGoto" data-id="${i}">Change</button></div>`).join("")}</div>
    <label class="agree"><input type="checkbox" id="w-agree" data-w="agree" ${d.agree ? "checked" : ""}><span>I understand 1Yard is run by volunteers, and help depends on who is available.</span></label>`;
  }
  return `<div class="stack" style="gap:20px">
    <div class="wiz-top"><span class="muted">Step ${w.step + 1} of ${n}</span><button class="linkbtn" data-act="wizQuit">Stop and go back</button></div>
    <div class="bar"><i style="width:${((w.step + 1) / n) * 100}%"></i></div>
    ${q}
    <div id="wiz-err" class="err" hidden></div>
    <div class="wiz-nav">
      <button class="bigbtn ghost" data-act="wizBack" ${w.step === 0 ? "disabled" : ""}>Back</button>
      ${step === "review" ? `<button class="bigbtn" data-act="wizSend">Send my request</button>` : `<button class="bigbtn" data-act="wizNext">Next</button>`}
    </div>
  </div>`;
}
function wizError() {
  const d = S.wiz.d, step = W_STEPS[S.wiz.step];
  if (step === "services" && !d.services.length) return "Please tap at least one thing you need help with.";
  if (step === "where" && !d.address.trim()) return "Please type your street address.";
  if (step === "when" && d.windows.length < MIN_DAYS) return `Please tap at least ${MIN_DAYS} days.`;
  if (step === "tools" && neededTools(d.services).some((t) => d.tools[t] === undefined)) return "Please tap Yes or No for each tool.";
  if (step === "you" && !d.name.trim()) return "Please type your name.";
  if (step === "you" && !d.phone.trim() && !d.email.trim()) return "Please give us a phone number or an email.";
  if (step === "review" && !d.agree) return "Please tick the box to say you understand.";
  return "";
}

/* ============ ACTIONS ============ */
const now = () => new Date().toISOString();
const A = {
  role: (id) => { S.role = id; S.confirm = null; S.justSent = null; S.picking = null; S.resched = null; },
  tab: (id) => { S.adminTab = id; S.editing = null; S.resched = null; },
  jobFilter: (id) => { S.jobFilter = id; },
  boardFilter: (id) => { S.boardFilter = id; },
  approve: (id) => { const v = vol(id); v.status = "approved"; v.reviewedAt = now(); return `${v.name} approved. They can now do training.`; },
  decline: (id) => { const v = vol(id); v.status = "declined"; v.reviewedAt = now(); return `${v.name}'s application declined.`; },
  publish: (id) => {
    const j = job(id);
    if (!liveWindows(j).length) return "All of this client's days have passed. Use Edit details to add new ones.";
    Object.assign(j, { status: "scheduled", hours: +$("#h-" + id).value, publishedAt: now() });
    return `Published with ${liveWindows(j).length} day options. Volunteers can now sign up.`;
  },
  called: (id) => { job(id).toldAt = now(); return "Marked as called."; },
  noAnswer: (id) => { const j = job(id); j.attempts = (j.attempts || 0) + 1; j.lastAttemptAt = now(); return "Logged. It stays on the list so you can try again."; },
  resched: (id) => { S.resched = id; S.editing = null; setTimeout(() => $("#resched-card")?.scrollIntoView({ block: "start", behavior: "smooth" })); },
  reschedCancel: () => { S.resched = null; },
  moveTime: (id) => {
    const j = job(id), date = $("#mv-date").value;
    if (!date) return toast("Pick a date."), SKIP;
    Object.assign(j, { date, start: $("#mv-start").value, timeChangedAt: now(), toldAt: now() });
    S.resched = null;
    return `Moved to ${whenText(j)}. Both volunteers will see the change.`;
  },
  repost: (id) => {
    const j = job(id), wins = readWindows("rw").filter((x) => x.date > today());
    if (!wins.length) return toast("Add at least one future day."), SKIP;
    S.signups = S.signups.filter((s) => s.jobId !== id);
    Object.assign(j, { windows: wins, date: null, start: null, toldAt: null, timeChangedAt: null, attempts: 0 });
    S.resched = null;
    return "Reposted with new days. Volunteers can sign up again.";
  },
  pickOpen: (id) => { S.picking = id; },
  pickCancel: () => { S.picking = null; },
  choose: (id) => {
    const v = vol(S.vid), j = job(id), [date, start] = $("#pk-" + id).value.split("|");
    const mine = crew(id).some((s) => s.vid === v.id);
    if (mine) { if (isFull(j)) return "Your partner has joined. Ask an admin to change the time."; Object.assign(j, { date, start }); S.picking = null; return `Time changed to ${whenText(j)}.`; }
    const r = canJoin(v, j); if (!r.ok) return r.why;
    if (crew(id).length) return "Someone just picked a time. Sign up for theirs instead.";
    S.signups.push({ id: uid("s"), jobId: id, vid: v.id, asTrainee: v.status === "trainee", at: now() });
    Object.assign(j, { date, start }); S.picking = null;
    return `You're signed up for ${whenText(j)}. ${v.status === "trainee" ? "Now waiting for an experienced volunteer." : "Waiting for a second volunteer."}`;
  },
  reject: (id) => { job(id).status = "declined"; return "Request declined. Remember to call the client."; },
  acancel: (id) => { job(id).status = "cancelled"; S.signups = S.signups.filter((s) => s.jobId !== id); return "Job cancelled."; },
  done: (id) => {
    const j = job(id); j.status = "done"; j.doneAt = now();
    const promoted = crew(id).filter((s) => s.asTrainee).map((s) => vol(s.vid)).filter((v) => v.status === "trainee" && shadowCount(v.id) >= SHADOW_SHIFTS_NEEDED);
    promoted.forEach((v) => { v.status = "experienced"; v.promotedAt = now(); });
    return promoted.length ? `Job done. ${promoted.map((v) => v.name).join(" and ")} is now an experienced volunteer!` : "Job marked as done.";
  },
  join: (id) => {
    const v = vol(S.vid), j = job(id), r = canJoin(v, j);
    if (!r.ok) return r.why;
    if (!isLocked(j)) { S.picking = id; return; }
    S.signups.push({ id: uid("s"), jobId: id, vid: v.id, asTrainee: v.status === "trainee", at: now() });
    return isFull(j) ? "You're signed up. The crew is complete." : v.status === "trainee" ? "You're signed up. Now waiting for an experienced volunteer." : "You're signed up. Waiting for a second volunteer.";
  },
  leave: (id) => { S.confirm = "leave:" + id; },
  leaveYes: (id) => {
    S.signups = S.signups.filter((s) => !(s.jobId === id && s.vid === S.vid)); S.confirm = null;
    const j = job(id);
    if (!crew(id).length) Object.assign(j, { date: null, start: null, timeChangedAt: null });
    j.toldAt = null;
    return "You left the job. The spot is open again.";
  },
  confirmNo: () => { S.confirm = null; },
  ccancel: (id) => { S.confirm = "ccancel:" + id; S.justSent = null; },
  ccancelYes: (id) => { job(id).status = "cancelled"; S.signups = S.signups.filter((s) => s.jobId !== id); S.confirm = null; return "Your request is cancelled."; },
  finish: () => {
    const v = vol(S.vid), f = $("#waiver-file").files[0];
    Object.assign(v, { status: "trainee", trainedAt: now(), waiver: { name: f.name, size: f.size } });
    S.boardFilter = "all"; scrollTo(0, 0);
    return "Training complete. You can now sign up for jobs as a trainee.";
  },
  wizStart: () => {
    const c = client(S.cid);
    if (c && activeJob(c.id)) return "You already have a request open. You can ask again once it's done.";
    S.justSent = null; S.confirm = null;
    S.wiz = { step: 0, d: { services: [], address: c?.address || "", postal: c?.postal || "", area: c?.area || "", windows: [], tools: {}, flags: [], notes: "", name: c?.name || "", phone: c?.phone || "", email: c?.email || "", contact: c?.contact || "phone", agree: false } };
    scrollTo(0, 0);
  },
  winDay: (date) => {
    const d = S.wiz.d, i = d.windows.findIndex((x) => x.date === date);
    if (i >= 0) d.windows.splice(i, 1);
    else if (d.windows.length >= MAX_DAYS) return `You can pick up to ${MAX_DAYS} days.`;
    else d.windows.push({ date, part: "any" });
  },
  winPart: (id) => { const [date, part] = id.split("|"); S.wiz.d.windows.find((x) => x.date === date).part = part; },
  pick: (_, b) => {
    const d = S.wiz.d, f = b.dataset.field, val = b.dataset.val;
    if (f.startsWith("tools.")) d.tools[f.slice(6)] = val === "1";
    else if (b.dataset.multi) d[f] = d[f].includes(val) ? d[f].filter((x) => x !== val) : [...d[f], val];
    else d[f] = val;
  },
  wizNext: () => { const e = wizError(); if (e) return showWizErr(e); S.wiz.step++; if (W_STEPS[S.wiz.step] === "tools" && !neededTools(S.wiz.d.services).length) S.wiz.step++; scrollTo(0, 0); },
  wizBack: () => { S.wiz.step--; if (W_STEPS[S.wiz.step] === "tools" && !neededTools(S.wiz.d.services).length) S.wiz.step--; scrollTo(0, 0); },
  wizGoto: (id) => { S.wiz.step = +id; scrollTo(0, 0); },
  wizQuit: () => { S.wiz = null; },
  wizSend: () => {
    const e = wizError(); if (e) return showWizErr(e);
    const d = S.wiz.d; let c = client(S.cid);
    if (c && activeJob(c.id)) { S.wiz = null; return "You already have a request open."; }
    const info = { name: d.name.trim(), phone: d.phone.trim(), email: d.email.trim(), contact: d.contact, address: d.address.trim(), city: "Kingston", postal: d.postal.trim().toUpperCase(), area: d.area.trim() || "Kingston" };
    if (c) Object.assign(c, info); else { c = { id: uid("c"), ...info }; S.clients.push(c); S.cid = c.id; }
    const tools = {}; neededTools(d.services).forEach((t) => (tools[t] = !!d.tools[t]));
    S.jobs.push({ id: uid("j"), clientId: c.id, services: d.services, tools, flags: d.flags, notes: d.notes.trim(), windows: [...d.windows].sort((a, b) => a.date.localeCompare(b.date)), status: "review", createdAt: now() });
    S.wiz = null; S.justSent = true; scrollTo(0, 0);
  },
  edit: (id) => { S.editing = id; setTimeout(() => $("#edit-card")?.scrollIntoView({ block: "start", behavior: "smooth" })); },
  editCancel: () => { S.editing = null; },
  editSave: (id) => {
    const j = job(id), c = client(j.clientId), val = (k) => $("#e-" + k).value.trim();
    const checked = (n) => [...document.querySelectorAll(`input[name="${n}"]:checked`)].map((i) => i.value);
    const services = checked("e-svc");
    if (!services.length) return toast("Pick at least one type of work."), SKIP;
    if (!val("address")) return toast("The address can't be empty."), SKIP;
    Object.assign(c, { name: val("name"), phone: val("phone"), email: val("email"), contact: $("#e-contact").value, address: val("address"), postal: val("postal").toUpperCase(), area: val("area") || "Kingston" });
    const tools = {}; checked("e-tool").forEach((t) => (tools[t] = true));
    Object.assign(j, { services, tools, flags: checked("e-flag"), notes: val("notes"), editedAt: now() });
    if ($("#ew-date-0")) { const wins = readWindows("ew"); if (!wins.length) return toast("Add at least one day the client is free."), SKIP; j.windows = wins; }
    S.editing = null;
    return "Request updated.";
  },
  reset: () => { const r = S.role; S = seed(); S.role = r; return "Demo data reset."; },
};
const SKIP = Symbol();
function showWizErr(e) { const el = $("#wiz-err"); el.textContent = e; el.hidden = false; el.scrollIntoView({ block: "nearest" }); return SKIP; }

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const msg = A[b.dataset.act]?.(b.dataset.id, b);
  if (msg === SKIP) return;
  save(); render();
  if (msg) toast(msg);
});
document.addEventListener("input", (e) => {
  const k = e.target.dataset.w;
  if (k && S.wiz) { S.wiz.d[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value; save(); }
});
document.addEventListener("change", (e) => {
  const id = e.target.id;
  if (id === "persona-v") { S.vid = e.target.value; S.boardFilter = "all"; S.confirm = null; S.picking = null; save(); render(); }
  else if (id === "persona-c") { S.cid = e.target.value; S.wiz = null; S.justSent = null; S.confirm = null; save(); render(); }
  else if (id === "waiver-file" || id === "done-training") {
    const f = $("#waiver-file").files[0], isPdf = f && (f.type === "application/pdf" || /\.pdf$/i.test(f.name));
    $("#file-note").textContent = !f ? "No file chosen yet." : isPdf ? `📄 ${f.name} · ${kb(f.size)}` : "That file isn't a PDF. Upload the signed waiver as a PDF.";
    const ok = isPdf && $("#done-training").checked;
    $("#finish").disabled = !ok;
    $("#finish-hint").textContent = ok ? "Ready to go." : "Tick the box and upload your waiver to continue.";
  }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "signup") return;
  e.preventDefault();
  const skills = [...document.querySelectorAll('input[name="skill"]:checked')].map((i) => i.value);
  if (!skills.length) return toast("Pick at least one thing you can do.");
  const v = { id: uid("v"), name: $("#f-name").value.trim(), email: $("#f-email").value.trim(), phone: $("#f-phone").value.trim(), uni: $("#f-uni").value,
    year: $('input[name="year"]:checked')?.value || "", skills, avail: [...document.querySelectorAll('input[name="avail"]:checked')].map((i) => i.value),
    why: $("#f-why").value.trim(), status: "pending", appliedAt: now() };
  S.volunteers.push(v); S.vid = v.id; save(); render(); scrollTo(0, 0);
  toast("Application sent. Switch to Admin to review it.");
});
render();
</script>
